name: Bug report
description: Something in connie is broken or wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Paste the command and the error. Remove your CONNIE_CONTACT address and anything private.
      render: shell
  - type: input
    id: version
    attributes:
      label: connie version
      description: Output of `connie version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 arm64, Ubuntu 24.04, Windows 11
